

services:
  mongodb:
    image: mongo:latest
    container_name: confix-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123

  nextjs:
    build: .
    container_name: confix-nextjs
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/confix?authSource=admin
      - JWT_SECRET=supersecretjwtkey2026changeinproduction
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - mongodb
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true

volumes:
  mongodb_data: